# Signs in with the test account from EMAIL and PASSWORD, and lands on Home.
appId: host.exp.Exponent
---
- launchApp
# Expo Go opens on its own home screen: load the project from Metro.
- openLink: ${APP_URL || 'exp://127.0.0.1:8081'}
- tapOn: Email
- inputText: ${EMAIL}
- tapOn: Password
- inputText: ${PASSWORD}
- tapOn:
    text: Sign in
    index: 1
- extendedWaitUntil:
    visible: Waiting on you
    timeout: 15000
